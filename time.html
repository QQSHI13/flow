<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Simple fullscreen clock display">
    <meta name="theme-color" content="#111213">
    <title>Time</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ccircle cx='50' cy='50' r='45' fill='%23111213' stroke='%23fff' stroke-width='4'/%3E%3Ccircle cx='50' cy='50' r='3' fill='%23fff'/%3E%3Cline x1='50' y1='50' x2='50' y2='20' stroke='%23fff' stroke-width='4' stroke-linecap='round'/%3E%3Cline x1='50' y1='50' x2='70' y2='50' stroke='%23fff' stroke-width='3' stroke-linecap='round'/%3E%3C/svg%3E">

    <!-- PWA Manifest -->
    <link rel="manifest" href="manifest.json">

    <!-- Shared tokens/primitives (vendored copy of tools-suite/shared/theme.css) -->
    <link rel="stylesheet" href="theme/theme.css">

    <style>
        .blank {
            display: inline-block;
            box-sizing: content-box;
            cursor: normal;
            margin: 0;                       /* it is an <h1> now */
            padding: 4% 6%;
            border: 1px solid #69696962;
            border-radius: 50px;
            /* was `font: normal 1500%/normal` = a fixed 240px font that could not fit a
               phone; scale with the viewport instead and keep it on one line */
            font-family: Arial, Helvetica, sans-serif;
            font-weight: normal;
            font-size: clamp(3rem, 20vw, 15rem);
            line-height: 1;
            white-space: nowrap;
            color: rgba(255, 255, 255, 0.9);
            text-indent: 1px;
            text-overflow: clip;
            letter-spacing: 1px;
            word-spacing: 24px;
            background: rgba(96, 96, 96, 0.36);
            box-shadow: 7px 7px 11px 0 rgba(0, 0, 0, 0.46);
            text-shadow: 5px 5px 11px rgba(0, 0, 0, 0.64);
            transition: all 300ms cubic-bezier(0.42, 0, 0.58, 1);
        }
        
        body, html {
            height: 100%;
            margin: 0;
            padding: 0;
        }
        
        body {
            background-color: rgb(17, 18, 19);
            font: normal;
            color: rgb(255, 255, 255);
            z-index: -1000;
            min-height: 100vh;
            position: relative;
        }
        
        #time {
            position: absolute;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
        }
        
        #tim {
            overflow-y: auto;
            overflow-x: hidden;
        }
    </style>
</head>

<body id="tim">
    <h1 class="blank" id="time"></h1>

    <script>
        // Clock interval reference for cleanup
        let clockInterval;
        
        function updateTime() {
            const date = new Date();
            const hour = String(date.getHours()).padStart(2, '0');
            const minutes = String(date.getMinutes()).padStart(2, '0');
            const timeElement = document.getElementById('time');
            if (timeElement) {
                timeElement.textContent = hour + ':' + minutes;
            }
        }
        
        // Initialize clock
        updateTime();
        clockInterval = setInterval(updateTime, 1000);
        
        // Clear interval when page is hidden to prevent memory leak
        document.addEventListener('visibilitychange', () => {
            if (document.hidden) {
                if (clockInterval) {
                    clearInterval(clockInterval);
                    clockInterval = null;
                }
            } else {
                updateTime();
                clockInterval = setInterval(updateTime, 1000);
            }
        });
    </script>
    
    <!-- Service Worker Registration -->
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js')
                    .then(registration => {
                        console.log('SW registered:', registration);
                        
                        // Auto-refresh when a new service worker takes control
                        // Only auto-reload when an UPDATE replaces a controller this page already had.
                        // On a first visit the new worker claims an uncontrolled page, and reloading
                        // there would cost every first-time visitor a second page load.
                        const swHadController = !!navigator.serviceWorker.controller;
                        navigator.serviceWorker.addEventListener('controllerchange', () => {
                            if (!swHadController) return;
                            console.log('New service worker activated - reloading page');
                            window.location.reload();
                        });
                    })
                    .catch(error => {
                        console.log('SW registration failed:', error);
                    });
            });
        }
    </script>
</body>
</html>
