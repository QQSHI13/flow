name: Validate PWA

on:
  push:
    branches: ['main']
  pull_request:
    branches: ['main']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-pwa:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Verify manifest.json exists
        run: |
          if [ ! -f manifest.json ]; then
            echo "❌ manifest.json is missing"
            exit 1
          fi
          echo "✅ manifest.json found"

      - name: Verify service worker is accessible
        run: |
          if [ ! -f sw.js ]; then
            echo "❌ sw.js is missing"
            exit 1
          fi
          echo "✅ sw.js found"

      - name: Verify index.html links manifest and a service worker is registered
        run: |
          grep -q 'rel="manifest"' index.html || { echo "❌ index.html missing manifest link"; exit 1; }
          echo "✅ index.html links manifest.json"
          # Flow registers its service worker from app.js, not inline in index.html.
          grep -rqs 'serviceWorker.register' --include='*.html' --include='*.js' . \
            || { echo "❌ no serviceWorker.register call found"; exit 1; }
          echo "✅ a service worker is registered"

      - name: Validate manifest.json JSON syntax
        run: |
          python3 -c "import json, sys; json.load(open('manifest.json')); print('✅ manifest.json is valid JSON')"

      - name: Verify required manifest fields
        run: |
          python3 << 'PY'
          import json, sys
          with open('manifest.json') as f:
              m = json.load(f)
          required = ['name', 'short_name', 'start_url', 'display', 'background_color', 'theme_color', 'icons']
          missing = [k for k in required if k not in m]
          if missing:
              print(f"❌ Missing manifest fields: {', '.join(missing)}")
              sys.exit(1)
          if not isinstance(m.get('icons'), list) or len(m['icons']) == 0:
              print("❌ manifest icons array is empty")
              sys.exit(1)
          sizes = {i.get('sizes') for i in m['icons']}
          if '192x192' not in sizes or '512x512' not in sizes:
              print("❌ manifest icons missing required 192x192 and/or 512x512 sizes")
              sys.exit(1)
          print("✅ manifest.json has all required PWA fields")
          PY

      - name: Verify icon files exist
        run: |
          if [ ! -f icon-192.png ]; then
            echo "❌ icon-192.png is missing"
            exit 1
          fi
          if [ ! -f icon-512.png ]; then
            echo "❌ icon-512.png is missing"
            exit 1
          fi
          echo "✅ Required icon files exist"

      - name: Check index.html at repo root
        run: |
          if [ ! -f index.html ]; then
            echo "❌ index.html not found at repository root"
            exit 1
          fi
          echo "✅ index.html is present at root"

      - name: Verify service worker bumps its cache name
        run: |
          grep -qE "CACHE[A-Z_]*\s*=\s*['\"][^'\"]*v[0-9]+['\"]" sw.js \
            || { echo "::error::sw.js cache name must carry a version suffix (e.g. flow-v6)"; exit 1; }
          echo "✅ sw.js uses a versioned cache name"

      - name: Setup Node.js
        uses: actions/setup-node@v7

      - name: Install Lighthouse CI
        run: npm install -g @lhci/cli@0.14.x

      # Lighthouse 12 removed the "pwa" category, so PWA conformance is asserted
      # by the explicit steps above. Lighthouse gates the remaining categories.
      - name: Run Lighthouse CI
        run: lhci autorun --config=lighthouserc.json
        env:
          LHCI_GITHUB_APP_TOKEN: ${{ secrets.GITHUB_TOKEN }}
